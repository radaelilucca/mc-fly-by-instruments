# Build performance and reproducible local Gradle behavior.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.236
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod identity
mod_id=aeronautics_fly_by_instruments
mod_name=Aeronautics: Fly by Instruments
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.radaeli.aeronauticsflybyinstruments
mod_authors=Radaeli
mod_description=Avionics and flight instruments for Create Aeronautics.

# Dependency metadata contracts. The local JAR paths below are development inputs,
# not files bundled into the published addon.
create_version_range=[6.0.10,)
aeronautics_version_range=[1.3,)
sable_version_range=[2.0.5,2.1.0)
computercraft_version_range=[1.120.0,)

# Override these with -P<property>=<path> when using a different local baseline.
create_jar=../sable-horses/run/mods/create-1.21.1-6.0.10.jar
aeronautics_jar=../sable-horses/run/mods/create-aeronautics-bundled-1.21.1-1.3.2.jar
sable_jar=../sable-horses/run/mods/sable-neoforge-1.21.1-2.0.5.jar
computercraft_jar=libs/cc-tweaked-1.21.1-neoforge-1.120.0.jar
