plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

// The dependency properties point at local development JARs. Missing files are
// ignored so the empty entrypoint can still be structurally checked before the
// external mod baselines are installed.
def configuredFile = { String propertyName ->
    def configuredPath = project.findProperty(propertyName)
    configuredPath ? project.file(configuredPath) : null
}

def createJar = configuredFile('create_jar')
def aeronauticsJar = configuredFile('aeronautics_jar')
def sableJar = configuredFile('sable_jar')
def computercraftJar = configuredFile('computercraft_jar')
def rUiLibJar = configuredFile('r_ui_lib_jar')

def existingDependencyFiles = {
    [createJar, aeronauticsJar, sableJar, computercraftJar, rUiLibJar]
            .findAll { it != null && it.isFile() }
}

def aeronauticsCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/aeronautics')
def sableCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/sable')
def createCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/create')

def extractCreateCompileJars = tasks.register('extractCreateCompileJars', Sync) {
    onlyIf { createJar != null && createJar.isFile() }
    from {
        createJar == null ? files() : zipTree(createJar).matching {
            include 'META-INF/jarjar/*.jar'
        }
    }
    eachFile { path = name }
    includeEmptyDirs = false
    into(createCompileJarsDirectory)
}

def extractAeronauticsCompileJars = tasks.register('extractAeronauticsCompileJars', Sync) {
    onlyIf { aeronauticsJar != null && aeronauticsJar.isFile() }
    from {
        aeronauticsJar == null ? files() : zipTree(aeronauticsJar).matching {
            include 'META-INF/jarjar/*.jar'
        }
    }
    eachFile { path = name }
    includeEmptyDirs = false
    into(aeronauticsCompileJarsDirectory)
}

def extractSableCompileJars = tasks.register('extractSableCompileJars', Sync) {
    onlyIf { sableJar != null && sableJar.isFile() }
    from {
        sableJar == null ? files() : zipTree(sableJar).matching {
            include 'META-INF/jarjar/*.jar'
        }
    }
    eachFile { path = name }
    includeEmptyDirs = false
    into(sableCompileJarsDirectory)
}

configurations {
    localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testCompileOnly files(existingDependencyFiles)
    testImplementation files(computercraftJar)
    testImplementation files(rUiLibJar)
    compileOnly files(existingDependencyFiles)
    compileOnly files { fileTree(createCompileJarsDirectory.get().asFile) { include '*.jar' } }
    compileOnly files { fileTree(aeronauticsCompileJarsDirectory.get().asFile) { include '*.jar' } }
    compileOnly files { fileTree(sableCompileJarsDirectory.get().asFile) { include '*.jar' } }

    // These are development-only runtime inputs. The addon JAR never bundles
    // Create, Aeronautics, Sable, CC:Tweaked, or R-Ui Lib.
    localRuntime files(existingDependencyFiles)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version          : minecraft_version,
        minecraft_version_range    : minecraft_version_range,
        neo_version                : neo_version,
        loader_version_range       : loader_version_range,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                 : mod_authors,
        mod_description            : mod_description,
        create_version_range       : create_version_range,
        aeronautics_version_range  : aeronautics_version_range,
        sable_version_range        : sable_version_range,
        computercraft_version_range: computercraft_version_range,
        r_ui_lib_version_range     : r_ui_lib_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    dependsOn(extractCreateCompileJars)
    dependsOn(extractAeronauticsCompileJars, extractSableCompileJars)
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
